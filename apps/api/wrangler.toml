# Finance Tracker API (Cloudflare Worker).
#
# ALWAYS pass an environment: `--env dev` or `--env production`.
# Bindings are not inherited between environments, so each env has its own
# D1 database, R2 bucket, vars and secrets. Dev can never reach production:
# the dev Worker only has the dev bindings, and production secrets are set
# only with `wrangler secret put --env production` (never in .dev.vars).
#
# The top level deliberately has NO bindings: a deploy without --env would
# produce a Worker that refuses every request (see src/env.ts).

name = "ft-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------------------------------ dev
[env.dev]
name = "ft-api-dev"
workers_dev = true

[env.dev.vars]
ENVIRONMENT = "dev"
PLAID_ENV = "sandbox"
# IANA zone used to compute "today" for the user (cron, queries).
# TODO(revisit): assumed America/New_York; set to the user's real zone.
USER_TIME_ZONE = "America/New_York"
# Public base URL of this Worker: Plaid's webhook target and the Hosted Link
# redirect page. Local `wrangler dev` is not reachable by Plaid, so webhooks
# only arrive on the deployed dev Worker.
# Local dev keeps localhost; the deployed dev Worker gets https://ft-api-dev.ft-api.workers.dev via `npm run deploy:dev`.
PUBLIC_API_URL = "http://localhost:8787"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "ft-dev"
database_id = "7ab38311-1551-4024-85de-84aa07ec38a0"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "BACKUPS"
bucket_name = "ft-backups-dev"

[env.dev.triggers]
# Daily sync + snapshots, 11:00 UTC (early morning in US time zones).
# TODO(revisit): sync time is an open question in success-criteria §4.
# Weekly encrypted backup to R2, Sundays 12:00 UTC (§2 Nothing is lost).
# TODO(revisit): backup schedule is an open question in success-criteria §2.
crons = ["0 11 * * *", "0 12 * * SUN"]

# ------------------------------------------------------------------ production
[env.production]
name = "ft-api"
workers_dev = true

[env.production.vars]
ENVIRONMENT = "production"
PLAID_ENV = "production"
USER_TIME_ZONE = "America/New_York"
# The production Worker URL (workers.dev subdomain "ft-api").
PUBLIC_API_URL = "https://ft-api.ft-api.workers.dev"

[[env.production.d1_databases]]
binding = "DB"
database_name = "ft-prod"
# Created 2026-11-18 (`wrangler d1 create ft-prod`).
database_id = "36aa4eac-5be8-4a36-aaae-8eccac3018c5"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "BACKUPS"
# Created 2026-11-18 (`wrangler r2 bucket create ft-backups-prod`).
bucket_name = "ft-backups-prod"

[env.production.triggers]
crons = ["0 11 * * *", "0 12 * * SUN"]
